# Keeps this repository on the OPTBOT standard labels (OptBot-AI/.github/.github/labels.json).
name: OPTBOT labels

on:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * 1"
  push:
    branches: [main]
    paths: [.github/workflows/labels.yml]

permissions:
  issues: write

jobs:
  labels:
    uses: ./.github/workflows/optbot-labels.yml
