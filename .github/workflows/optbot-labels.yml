# OPTBOT labels: keeps every repository on the standard label set in .github/labels.json
# (creates and recolors; never deletes). Called by each repository's labels.yml.
name: OPTBOT labels

on:
  workflow_call:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const want = await (await fetch("https://raw.githubusercontent.com/OptBot-AI/.github/main/.github/labels.json")).json();
            const have = await github.paginate(github.rest.issues.listLabelsForRepo, { ...context.repo, per_page: 100 });
            for (const l of want) {
              const cur = have.find(h => h.name.toLowerCase() === l.name.toLowerCase());
              if (!cur) { await github.rest.issues.createLabel({ ...context.repo, ...l }); core.info(`created ${l.name}`); }
              else if (cur.color !== l.color || (cur.description || "") !== l.description) {
                await github.rest.issues.updateLabel({ ...context.repo, name: cur.name, new_name: l.name, color: l.color, description: l.description }); core.info(`updated ${l.name}`);
              }
            }
