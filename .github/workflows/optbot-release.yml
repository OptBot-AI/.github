# OPTBOT release: push a tag like v1.2.0 and this publishes a GitHub release with notes grouped
# by label (see .github/release.yml in each repository). Called by each repository's release.yml.
name: OPTBOT release

on:
  workflow_call:

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace("refs/tags/", "");
            const r = await github.rest.repos.createRelease({ ...context.repo, tag_name: tag, name: `${context.repo.repo} ${tag}`, generate_release_notes: true });
            await github.rest.repos.updateRelease({ ...context.repo, release_id: r.data.id,
              body: `<img src="https://raw.githubusercontent.com/OptBot-AI/.github/main/assets/tight/optbot-ship-it.gif" height="96" alt=""> **Shipped.**\n\n` + r.data.body });
            core.info(r.data.html_url);
